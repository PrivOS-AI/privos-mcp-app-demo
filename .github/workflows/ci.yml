name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: bash scripts/check-node-pins.sh
      - run: npm ci
      - run: npm run typecheck:strict-unused
      - run: npm test
      - run: npm run preflight
      - run: npm run package
      - run: docker build -t privos-mcp-app-demo:test .
      - name: Hardened container smoke test
        run: |
          docker run -d --name reference-app --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 100 --tmpfs /tmp \
            -e PORT=3000 -p 127.0.0.1:3000:3000 privos-mcp-app-demo:test
          trap 'docker rm -f reference-app' EXIT
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/.well-known/mcp/manifest.json && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/.well-known/mcp/manifest.json
          docker exec reference-app sh -c '! command -v npm && ! command -v npx'
          # This container runs bare: NODE_ENV=production with no workload identity socket and no
          # paired identity file. The app must then serve only the manifest (so the marketplace
          # build node can still discover it), report alive-but-degraded on /health, hold /ready
          # at 503, and expose no MCP surface at all, so nothing can be dispatched (fail-closed).
          # The 403 DISPATCH_ASSERTION_INVALID refusal only exists once an identity is loaded.
          curl -sf http://127.0.0.1:3000/health | grep -q '"degraded":true'
          test "$(curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3000/ready)" = "503"
          grep -q '"reason":"PRODUCTION_WITHOUT_IDENTITY"' /tmp/ready.json
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            --json '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            http://127.0.0.1:3000/mcp)
          test "$status" = "404"
